{% extends 'main/base.html' %}
{% load static %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="modal">
    <div class="modal-body">
        <form>
            <div class="register-form active">
                <div class="brand-logos">
                    <!-- Здесь могут быть логотипы DeWalt и JCB -->
                </div>
                <div class="brand-name">Регистрация</div>
                <!-- Кнопка закрытия -->
                <label for="authModalToggle" class="close-btn">×</label>
                <div class="form-group">
                    <label for="name">Полное имя</label>
                    <input type="text" id="name" placeholder="Введите ваше имя" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="email">Номер телефона</label>
                    <input type="email" id="email" placeholder="+7" required>
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="Придумайте пароль" required>
                </div>

                <div class="form-group">
                    <input type="password" id="password" placeholder="Повторите пароль" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">
                        Я соглашаюсь с <a href="#">условиями использования</a> и
                        <a href="#">политикой конфиденциальности</a>
                    </label>
                </div>

                <button type="submit" class="btn-register">Зарегистрироваться</button>

                <div class="login-link">
                    Уже есть аккаунт? <button class="switch-form" data-form="login">Войти</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
